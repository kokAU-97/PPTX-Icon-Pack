<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Icon Library</title>
  <link rel="stylesheet" href="taskpane.css?v=6" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <div id="app" class="app" hidden>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>My Icons</h1>
      </div>
      <label class="btn btn-primary" for="file-input">
        + Add icons
        <input id="file-input" type="file" accept=".svg,.png,.jpg,.jpeg" multiple hidden />
      </label>
    </header>

    <div class="toolbar">
      <div class="search">
        <input id="search-input" type="search" placeholder="Search your icons" aria-label="Search your icons" />
      </div>
      <button id="clear-all-btn" class="btn btn-ghost" title="Remove every icon from the library">Clear all</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <main id="grid" class="grid" aria-label="Icon library"></main>

    <p id="empty-state" class="hint-line" hidden>Your library is empty — add SVG or PNG icons to get started.</p>
    <p id="no-results" class="hint-line" hidden>No icons match "<span id="no-results-query"></span>".</p>
  </div>

  <div id="loading" class="loading">Loading your icon library…</div>

  <script src="taskpane.js?v=6"></script>
</body>
</html>
